<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Revisão de Balanço · Grupo Dicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fixa + área de trabalho em colunas fluidas; tabelas densas como num papel de trabalho de revisão. */
:root {
  --bg: #f0f3f8;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #142238;
  --muted: #566479;
  --line: #d7deea;
  --accent: #1d3f74;
  --accent-ink: #ffffff;
  --accent-soft: rgba(29, 63, 116, 0.10);
  --brand-teal: #2c8da5;
  --side: #1d3f74;
  --side-ink: #dde6f2;
  --ok: #2b7a52; --warn: #a86b00; --danger: #b42318; --info: #3a6488;
  --ok-bg: #e5f3ea; --warn-bg: #fbf0d9; --danger-bg: #fbe6e3; --info-bg: #e5edf5;
  --sev-critico: #9f1d14; --sev-alto: #d1561a; --sev-moderado: #c99410; --sev-baixo: #3a8a62; --sev-informativo: #6f8796;
  --font-ui: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', 'Arial Narrow', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1518; --surface: #142026; --surface-2: #18262d; --ink: #e2eaed; --muted: #92a3ab; --line: #273840;
    --accent: #8fb4ea; --accent-ink: #0b1a33; --accent-soft: rgba(143, 180, 234, 0.16); --side: #12284d; --side-ink: #d0dcec;
    --ok: #6cc497; --warn: #e2b04f; --danger: #f08a7e; --info: #8ab4dc;
    --ok-bg: rgba(108, 196, 151, 0.14); --warn-bg: rgba(226, 176, 79, 0.15); --danger-bg: rgba(240, 138, 126, 0.15); --info-bg: rgba(138, 180, 220, 0.14);
    --sev-critico: #f0685c; --sev-alto: #f2924f; --sev-moderado: #e6c14f; --sev-baixo: #6cc497; --sev-informativo: #93abb9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1518; --surface: #142026; --surface-2: #18262d; --ink: #e2eaed; --muted: #92a3ab; --line: #273840;
  --accent: #8fb4ea; --accent-ink: #0b1a33; --accent-soft: rgba(143, 180, 234, 0.16); --side: #12284d; --side-ink: #d0dcec;
  --ok: #6cc497; --warn: #e2b04f; --danger: #f08a7e; --info: #8ab4dc;
  --ok-bg: rgba(108, 196, 151, 0.14); --warn-bg: rgba(226, 176, 79, 0.15); --danger-bg: rgba(240, 138, 126, 0.15); --info-bg: rgba(138, 180, 220, 0.14);
  --sev-critico: #f0685c; --sev-alto: #f2924f; --sev-moderado: #e6c14f; --sev-baixo: #6cc497; --sev-informativo: #93abb9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
h1 { font-size: 1.75rem; font-weight: 600; }
.h1-sub { font-weight: 400; font-size: 1.2rem; }
h3 { font-size: 1.08rem; font-weight: 600; }
h4 { font-size: 0.95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.92em; }
.num { white-space: nowrap; }
.num-neg, .num-c { color: var(--danger); }
.dc { font-size: 0.75em; margin-left: 3px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.txt-danger { color: var(--danger); } .txt-warn { color: var(--warn); } .txt-ok { color: var(--ok); }
.r { text-align: right; } .c { text-align: center; } .nowrap { white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Estrutura */
.shell { background: linear-gradient(90deg, var(--side) 236px, transparent 236px); display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; align-self: start; padding: 18px 12px; padding-top: max(18px, env(safe-area-inset-top, 0px)); }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 6px 8px 20px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.14); }
.brand-logo { width: 150px; height: auto; display: block; }
.topbar-logo { height: 26px; width: auto; }
.report-logo { height: 44px; width: auto; display: block; margin-bottom: 14px; }
.brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 600; }
.brand-name { font-family: var(--font-display); font-weight: 500; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-ink); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { text-align: left; background: none; border: 0; color: var(--side-ink); padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
.nav-item:hover { background: rgba(255,255,255,0.06); }
.nav-on { background: rgba(255,255,255,0.13); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--brand-teal); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
.who { display: flex; flex-direction: column; } .who .muted { color: #9fb6bc; }
.mode { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #8fd0b4; }
.mode-local { color: #f0c46a; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.content { padding-block: 22px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page { display: flex; flex-direction: column; gap: 16px; max-width: 1360px; }
.page.narrow { max-width: 900px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .end { justify-content: flex-end; }
.row-between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 16px; } .stack-sm { display: flex; flex-direction: column; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.back { align-self: flex-start; font-size: 0.9rem; }
.loading, .boot { padding: 60px 0; text-align: center; color: var(--muted); }
.boot { display: grid; place-items: center; gap: 12px; min-height: 100%; }

/* Faixas */
.banner { padding: 10px 24px; border-bottom: 1px solid var(--line); font-size: 0.9rem; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.content .banner { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.banner-warn { background: var(--warn-bg); } .banner-err { background: var(--danger-bg); } .banner-info { background: var(--info-bg); }

/* Cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 80ch; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card-body { padding: 14px 16px; min-width: 0; }
.section-title { margin: 6px 0 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Botões e campos */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 0.85rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.confirm-inline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-wide { grid-column: 1 / -1; }
.field-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field-hint { font-size: 0.8rem; color: var(--muted); } .field-error { font-size: 0.8rem; color: var(--danger); }
.input { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.input:disabled { background: var(--surface-2); color: var(--muted); }
.textarea { resize: vertical; min-height: 64px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; border: 0; padding: 0; margin: 0 0 10px; min-width: 0; }
.form-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form-inline .input { width: auto; flex: 1 1 180px; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.checks, .rule-toggles { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; }
.rule-toggles { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.toolbar .field { flex: 0 1 200px; }
.grid-filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 14px; }
.filters .card-body { padding-block: 12px; }
.sticky-actions { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0; background: linear-gradient(transparent, var(--bg) 30%); }

/* Indicadores visuais */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.tone-neutral { background: var(--surface-2); border-color: var(--line); color: var(--muted); }
.tone-muted { background: transparent; border-color: var(--line); color: var(--muted); }
.tone-ok { background: var(--ok-bg); color: var(--ok); } .tone-warn { background: var(--warn-bg); color: var(--warn); }
.tone-danger { background: var(--danger-bg); color: var(--danger); } .tone-info { background: var(--info-bg); color: var(--info); }
.tone-accent { background: var(--accent-soft); color: var(--accent); }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
.sev::before { content: ''; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
.sev-critico { color: var(--sev-critico); } .sev-alto { color: var(--sev-alto); } .sev-moderado { color: var(--sev-moderado); } .sev-baixo { color: var(--sev-baixo); } .sev-informativo { color: var(--sev-informativo); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stats-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.stat-value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 0.8rem; color: var(--muted); }
.stat-danger { border-top: 3px solid var(--danger); } .stat-danger .stat-value { color: var(--danger); }
.stat-warn { border-top: 3px solid var(--warn); }
.progress { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.progress-bar { height: 100%; background: var(--accent); }
.bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 32px; gap: 10px; align-items: center; font-size: 0.9rem; }
.bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.evo { width: 100%; min-width: 320px; height: auto; display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 0.82rem; font-family: var(--font-mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.tone-ok { background: var(--ok); } .dot.tone-warn { background: var(--warn); } .dot.tone-danger { background: var(--danger); } .dot.tone-info { background: var(--info); } .dot.tone-accent { background: var(--accent); }
.sev-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.sev-cell { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); }
.sev-cell strong { font-family: var(--font-display); font-size: 1.5rem; }
.spark { display: block; }

/* Tabelas */
.table-wrap { overflow-x: auto; max-width: 100%; }
.table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.table th { text-align: left; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.table th.r { text-align: right; } .table th.c { text-align: center; }
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table.compact td { padding: 5px 8px; } .table.compact th { padding: 6px 8px; }
.row-link { cursor: pointer; } .row-link:hover td { background: var(--accent-soft); }
.row-total td { font-weight: 600; background: var(--surface-2); }
.row-sep td { font-family: var(--font-display); font-weight: 600; padding-top: 16px; color: var(--muted); text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.06em; }
.row-flag td { background: var(--warn-bg); }
.row-synth td { color: var(--muted); }
.row-header td { background: var(--accent-soft); font-weight: 600; }
.row-dim td { opacity: 0.5; }
.table.grid td { font-family: var(--font-mono); font-size: 0.78rem; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.sheet-preview { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); margin: 8px 0 12px; }
.matrix td.heat { background: color-mix(in srgb, var(--danger) calc(var(--h, 0) * 32%), transparent); }
.heat-n { font-weight: 700; font-family: var(--font-mono); }
.statement td:first-child { white-space: nowrap; }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 10px; }
.rules-table td { min-width: 120px; }
.kv { display: grid; grid-template-columns: minmax(130px, 34%) minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); font-size: 0.86rem; } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Abas e etapas */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; padding: 9px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab-on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab-count { font-size: 0.72rem; padding: 0 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-mono); }
.tab-warn { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; counter-reset: st; }
.steps li { counter-increment: st; }
.steps button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; cursor: pointer; font-size: 0.78rem; color: var(--muted); min-height: 100%; }
.steps button::before { content: counter(st); display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); margin-right: 6px; font-family: var(--font-mono); font-size: 0.7rem; }
.steps .step-done button { color: var(--ink); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.steps .step-done button::before { content: '✓'; background: var(--ok); border-color: var(--ok); color: #fff; }

/* Checklist */
.ck-list { list-style: none; padding: 0; margin: 0; }
.ck-item { border-top: 1px solid var(--line); }
.ck-item:first-child { border-top: 0; }
.ck-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 0; flex-wrap: wrap; }
.ck-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: none; border: 0; cursor: pointer; text-align: left; padding: 0; flex: 1 1 380px; min-width: 0; }
.ck-status { flex: 0 0 210px; }
.ck-open { background: linear-gradient(90deg, var(--accent-soft), transparent 40%); margin: 0 -16px; padding: 0 16px; }
.ck-body { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px; }
.ck-def { display: grid; gap: 4px; max-width: 90ch; font-size: 0.9rem; }
.ck-auto, .ck-review { border-left: 3px solid var(--accent); padding-left: 10px; display: flex; flex-direction: column; gap: 6px; }
.ck-summary { text-align: right; } .ck-summary strong { font-family: var(--font-display); font-size: 1.5rem; }
.ck-foot { border-top: 1px dashed var(--line); padding-top: 8px; }
.mini { margin: 4px 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.88rem; }
.group-progress { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.group-progress li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 200px) 48px; gap: 12px; align-items: center; font-size: 0.9rem; }

/* Importação */
.drop { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface-2); }
.drop-over { border-color: var(--accent); background: var(--accent-soft); }
.drop-off { opacity: 0.6; }
.map-grid { display: grid; gap: 6px; margin-bottom: 12px; }
.map-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(180px, 1.4fr) 140px; gap: 10px; align-items: center; padding: 4px 6px; border-radius: var(--radius); }
.map-need { background: var(--warn-bg); }
.alerts ul { margin: 8px 0; padding-left: 18px; font-size: 0.86rem; display: grid; gap: 3px; max-height: 260px; overflow: auto; }
.al-erro { color: var(--danger); } .al-alerta { color: var(--warn); } .al-info { color: var(--muted); }
.import-item { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 8px; }
.import-item:first-child { border-top: 0; }
.import-old { opacity: 0.75; }
.aux-link { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aux-link .input { width: auto; flex: 1 1 160px; }
.demo { margin-top: 10px; } .demo summary { cursor: pointer; color: var(--accent); }
details summary { cursor: pointer; }
.compare-pick .field { flex: 1 1 360px; max-width: 520px; }

/* Indicadores */
.ind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ind .card-body { display: flex; flex-direction: column; gap: 6px; }
.ind-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ind-name { font-weight: 600; }
.ind-value { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.ind-formula { color: var(--muted); }
.ind-vals { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; display: grid; gap: 2px; }
.ind-vals li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); }

/* Achados */
.finding { display: flex; flex-direction: column; gap: 14px; }
.finding section { display: flex; flex-direction: column; gap: 8px; }
.checks-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks-list li { border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.ck-ok { border-left-color: var(--ok) !important; } .ck-ex { border-left-color: var(--warn) !important; } .ck-no { border-left-color: var(--danger) !important; }
.evidence { display: flex; flex-direction: column; gap: 6px; }
.ev-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.ev-list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.comments { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

/* Relatório */
.report { max-width: 980px; display: flex; flex-direction: column; gap: 10px; }
.report h2 { font-size: 1.4rem; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.report h3 { margin-top: 10px; color: var(--accent); }
.tone-p { font-size: 0.92rem; }
.tone-p-nota { font-style: italic; color: var(--muted); }
.tone-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; padding: 1px 6px; margin-right: 6px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.howto { display: grid; gap: 6px; padding-left: 20px; margin: 0; }

/* Modal e avisos */
.modal-back { position: fixed; inset: 0; background: rgba(8, 20, 24, 0.5); display: grid; place-items: start center; padding: 40px 16px; overflow-y: auto; z-index: 50; padding-top: max(40px, env(safe-area-inset-top, 0px)); }
.modal { background: var(--surface); border-radius: 8px; width: min(640px, 100%); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
.modal-wide { width: min(980px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { padding: 10px 14px; border-radius: var(--radius); background: var(--ink); color: var(--bg); box-shadow: 0 6px 20px rgba(0,0,0,0.2); font-size: 0.9rem; }
.toast-erro { background: var(--danger); color: #fff; }
.saving { font-size: 0.8rem; color: var(--muted); }
.empty { padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty p { max-width: 60ch; }
.fatal { padding: 40px; max-width: 700px; } .fatal pre { white-space: pre-wrap; color: var(--danger); }

/* Telas estreitas */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 40; transform: translateX(-100%); transition: transform 0.2s; height: 100%; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .side-open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,0.4); }
  .topbar { display: flex; gap: 12px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); color: #fff; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .menu-btn { background: rgba(255,255,255,0.1); border: 0; color: #fff; padding: 6px 10px; border-radius: var(--radius); }
  .topbar-title { font-family: var(--font-display); font-weight: 600; flex: 1; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sev-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .map-row { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; }
  .row-between { flex-direction: column; }
  .ck-status { flex: 1 1 100%; }
  h1 { font-size: 1.45rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Fluxo da revisão */
.flow { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.flow button { width: 100%; height: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.flow-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.flow-n { flex: 0 0 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.8rem; }
.flow-done .flow-n { background: var(--ok); border-color: var(--ok); color: #fff; }
.flow-on button { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.subnav { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.88rem; }
.subnav button { background: none; border: 0; padding: 2px 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.subnav button.on { color: var(--ink); text-decoration: none; font-weight: 600; }

/* Pontos de atenção */
.prio-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.prio { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-top-width: 4px; border-radius: var(--radius); background: var(--surface); cursor: pointer; color: var(--ink); }
.prio-alta { border-top-color: var(--sev-alto); } .prio-media { border-top-color: var(--sev-moderado); } .prio-baixa { border-top-color: var(--sev-baixo); } .prio-done { border-top-color: var(--ok); cursor: default; }
.prio-on { outline: 2px solid var(--accent); outline-offset: 1px; }
.prio-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.prio-n { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; line-height: 1.1; }
.points { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.point { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 16px; padding: 14px; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.point-alta { border-left-color: var(--sev-alto); } .point-media { border-left-color: var(--sev-moderado); } .point-baixa { border-left-color: var(--sev-baixo); }
.point-old { opacity: 0.6; }
.point-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.point-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.point-where { font-size: 0.88rem; color: var(--muted); }
.point-todo { font-size: 0.9rem; }
.point-todo .tag, .tag { display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 1px 6px; margin-right: 6px; }
.point-more { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; border-top: 1px dashed var(--line); padding-top: 8px; }
.point-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.point-team { display: flex; flex-direction: column; gap: 6px; }
.serie { width: 100%; max-width: 320px; height: auto; display: block; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; cursor: pointer; color: var(--muted); }
.seg-btn:hover { border-color: var(--accent); }
.seg-on { font-weight: 600; border-color: transparent; }
.result-chart { width: 100%; min-width: 360px; height: auto; display: block; }
.row-part td { background: var(--surface-2); font-size: 0.85rem; }
@media (max-width: 900px) {
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .prio-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .point { grid-template-columns: minmax(0, 1fr); }
}

/* Painel da coordenação */
.dash-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.dash-tile { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; color: var(--ink); }
.dash-tile:hover { border-color: var(--accent); }
.dash-on { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.dash-tile .stat-value { font-size: 2rem; }
@media (max-width: 900px) { .dash-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dash-hot { border-color: var(--danger); background: var(--danger-bg); }
.dash-hot .stat-value { color: var(--danger); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .report-logo { background: #fff; padding: 6px 10px; border-radius: 6px; box-sizing: content-box; } }
:root[data-theme="dark"] .report-logo { background: #fff; padding: 6px 10px; border-radius: 6px; box-sizing: content-box; }
.resp-field { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.resp-field .input { width: min(320px, 100%); }
.boot-gate { max-width: 560px; margin: 0 auto; padding: 60px 16px; text-align: left; color: var(--ink); place-items: start; }
.boot-gate h2 { margin: 0; }
.side-link { color: var(--side-ink); text-align: left; }
.side-err { color: #ffd2cc; }

</style>
